name: Receiving PostgreSQL Workbench

on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: flowchain_ci
          POSTGRES_PASSWORD: flowchain_ci_password
          POSTGRES_DB: flowchain_ci_diagnostics
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U flowchain_ci -d flowchain_ci_diagnostics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://generate_only:generate_only@127.0.0.1:55432/flowchain_generate_only?schema=public
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://flowchain_ci:flowchain_ci_password@127.0.0.1:55432/flowchain_ci_diagnostics?schema=public
      - run: npm run db:check-drift
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:db:receiving
      - run: npm run test:api:receiving
      - run: npm run test:db:outbound
      - run: npm run test:api:outbound
      - run: npm run test:db:inventory-operations
      - run: npm run test:api:inventory-operations
      - run: npm run test:db:returns-quarantine
      - run: npm run test:api:returns-quarantine
      - run: npm run test:db:operational-finance
      - run: npm run test:api:operational-finance
      - run: npm run test:api:settings
      - run: npm run test:db:english
      - run: npm run test:db:us-defaults
      - run: npm run test:db:email-link-sign-in
      - run: npm run test:db:approval-email
      - run: npm run test:db:tenant-provision
      - run: npm run test:db:walkthrough-scenario
      - run: npm run test:db:tenant-scoped-reads
      - run: npm run test:db:master-data-writes
      - run: npm run test:db:data-import
      - run: npm run test:api:data-import
      - run: npm run test:db:supplier-tiers
      - run: npm run test:db:supplier-insights
      - run: npm run test:db:ai-workspace-access
      - run: npm run test:db:report-truncation
      - run: npm run test:db:inventory-allocation
      - run: npm run test:db:ai-knowledge
      - run: npm run test:ai:eval:knowledge
      - run: npm run test:db:ai-pgvector
        env:
          DATABASE_URL: postgresql://flowchain_ci:flowchain_ci_password@127.0.0.1:55432/flowchain_ci_diagnostics?schema=public
          FLOWCHAIN_PERSISTENCE_MODE: database
      - run: npm run test:db:authorization
      - run: npm run test:api:authorization
      - run: npm run test:db:intake
      - run: npm run test:api:intake
      - run: npm run test:db:structured-intake
      - run: npm run test:legacy-import-authority
      - run: npm run test:db:internal-settlement
      - run: npm run test:api:internal-settlement
      - run: npm run test:db:settlement-workflow-mobile
      - run: npm run test:api:mobile-sync
      - run: npm run test:db:mobile-authority-hardening
      - run: npm run test:api:mobile-sync-authorization
      - run: npm run test:api:mobile-po-approval
      - run: npm run test:api:mobile-po-db-authority
      - run: npm run test:api:mobile-receiving
      - run: npm run test:api:attachment-durability
      - run: npm run test:db:phase-5-2c1-controls
      - run: npm run test:api:mobile-sync-controls
      - run: npm run test:db:po-command-atomicity
      - run: npm run test:db:procurement-flow
      - run: npm run test:db:supplier-choice
      - run: npm run test:db:original-promise
      - run: npm run test:db:supplier-scorecard
      - run: npm run test:db:finance-read-permissions
      - run: npm run test:db:payment-records
      - run: npm run test:db:bill-before-receipt
      - run: npm run test:db:sales-read-permissions
      - run: npm run test:db:search-wildcards
      - run: npm run test:db:inventory-warehouse-scope
      - run: npm run test:db:search-graph-read-scope
      - run: npm run test:db:role-backfill-once
      - run: npm run test:db:po-close-receipt-cancel
      - run: npm run test:db:report-views
      - run: npm run test:db:rfq-response-revisions
      - run: npm run test:db:rfq-supplier-response-command
      - run: npm run test:db:rfq-supplier-comparison
      - run: npm run test:db:rfq-award-decision
      - run: npm run test:api:rfq-supplier-response
      - run: npm run test:api:rfq-award-decision
      - run: npm run test:db:upgrade-v0-5-2b-to-v0-5-2c
      - run: npm run test:integration:attachment-restart
      - run: npm run attachment:health-check
        env:
          NODE_ENV: test
          FLOWCHAIN_ATTACHMENT_STORAGE_PROVIDER: local
          FLOWCHAIN_UPLOAD_STORAGE_DIR: /tmp/flowchain-ci-attachment-diagnostics
      - run: npm run attachment:orphan-check
        env:
          DATABASE_URL: postgresql://flowchain_ci:flowchain_ci_password@127.0.0.1:55432/flowchain_ci_diagnostics?schema=public
          FLOWCHAIN_PERSISTENCE_MODE: database
          NODE_ENV: test
          FLOWCHAIN_ATTACHMENT_STORAGE_PROVIDER: local
          FLOWCHAIN_UPLOAD_STORAGE_DIR: /tmp/flowchain-ci-attachment-diagnostics
      - run: npm run test:ops:attachment-diagnostics
      - run: npm run test:api:receiving-decimal-parity
      - run: npm run test:domain:bank-statement-parser
      - run: npm run test:db:bank-reconciliation
      - run: npm run test:db:bank-reconciliation-evidence
      - run: npm run test:api:bank-reconciliation
      - run: npm run test:db:bank-security-hardening
      - run: npm run test:api:bank-projection-security
      - run: npm run test:db:bank-candidate-quality
      - run: npm run test:domain:ai-record-validity
      - run: npm run test:domain:ai-query-planner
      - run: npm run test:domain:ai-query-executor
      - run: npm run test:domain:supplier-action-summary
      - run: npm run test:ai:business-query-planning
      - run: npm run test:db:ai-cross-domain-read
      - run: npm run test:db:ai-report-agreement
      - run: npm run test:api:ai-business-query
      - run: npm run test:ai:eval
      - run: npm run bank:mapping-security-scan
        env:
          DATABASE_URL: postgresql://flowchain_ci:flowchain_ci_password@127.0.0.1:55432/flowchain_ci_diagnostics?schema=public
          FLOWCHAIN_PERSISTENCE_MODE: database
      - run: npm run pilot:check
        env:
          FLOWCHAIN_PERSISTENCE_MODE: database
          DATABASE_URL: postgresql://readiness_only:readiness_only@127.0.0.1:55432/flowchain_readiness_only?schema=public
          FLOWCHAIN_LOCAL_SESSION_SECRET: ci-readiness-check-secret-at-least-32-characters
          FLOWCHAIN_DEFAULT_TENANT_ID: ci-readiness-tenant
          FLOWCHAIN_ENABLE_DB_RECEIVING_POSTING: 'true'
          FLOWCHAIN_ENABLE_DB_OUTBOUND_POSTING: 'true'
          FLOWCHAIN_ENABLE_DB_INVENTORY_OPERATIONS: 'true'
          FLOWCHAIN_ENABLE_DB_OPERATIONAL_FINANCE: 'true'
          FLOWCHAIN_ENABLE_DB_INTERNAL_SETTLEMENT: 'true'
          FLOWCHAIN_ENABLE_DB_SETTLEMENT_WORKFLOW: 'true'
          FLOWCHAIN_ENABLE_DB_MOBILE_SYNC: 'true'
          FLOWCHAIN_ENABLE_DB_MOBILE_OPERATIONS: 'true'
          FLOWCHAIN_SYNC_CURSOR_SECRET: ci-mobile-sync-cursor-secret-at-least-32-characters
          FLOWCHAIN_ALLOW_LOCAL_ACTOR_BOOTSTRAP: 'false'

  # The browser suites run in three shards on separate runners, so no single
  # job nears its time limit. Each shard is about six minutes of suites:
  #   walkthrough  product recovery (acceptance, English walkthrough, supplier
  #                performance, assistant and every phase not in "shell"),
  #                English sign-in, assistant business query planning
  #   shell        product recovery shell, routing and sign-in phases,
  #                settings, authorization
  #   operations   receiving, reports, outbound, RFQ, inventory, returns,
  #                intake, operational finance, mobile operations
  # Suites for frozen modules (internal settlement, settlement workflow, bank
  # reconciliation and security, mobile sync controls) run nightly in
  # frozen-modules-nightly.yml. Their node tests still run in verify.
  browser-shard:
    name: browser (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [walkthrough, shell, operations]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://generate_only:generate_only@127.0.0.1:55432/flowchain_generate_only?schema=public
      - id: browser-setup
        run: npx playwright install --with-deps chromium
      # Each suite runs even after an earlier one fails, so one failure cannot
      # hide others; the job still fails. Suites are skipped only when setup failed.
      - run: npm run test:browser:product-recovery
        if: ${{ matrix.shard == 'walkthrough' && !cancelled() && steps.browser-setup.outcome == 'success' }}
        env:
          PRODUCT_RECOVERY_GROUP: walkthrough
      - run: npm run test:browser:english
        if: ${{ matrix.shard == 'walkthrough' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:ai-business-query-planning
        if: ${{ matrix.shard == 'walkthrough' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:product-recovery
        if: ${{ matrix.shard == 'shell' && !cancelled() && steps.browser-setup.outcome == 'success' }}
        env:
          PRODUCT_RECOVERY_GROUP: shell
      - run: npm run test:browser:settings
        if: ${{ matrix.shard == 'shell' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:authorization
        if: ${{ matrix.shard == 'shell' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:receiving
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:reports
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:outbound
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:canonical-rfq-detail
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:canonical-rfq-comparison
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:canonical-rfq-supplier-response
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:inventory-operations
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:returns-quarantine
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:intake
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:operational-finance
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:mobile-operations
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - run: npm run test:browser:mobile-authority
        if: ${{ matrix.shard == 'operations' && !cancelled() && steps.browser-setup.outcome == 'success' }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report
            test-results

  # The required "browser" check: it passes only when every shard passed.
  # A shard that failed, timed out or was cancelled fails it.
  browser:
    needs: browser-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every browser shard passed
        run: |
          echo "browser shards: ${{ needs.browser-shard.result }}"
          test "${{ needs.browser-shard.result }}" = success

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify final production image
        run: npm run test:container:production
        env:
          FLOWCHAIN_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FLOWCHAIN_BRANCH: ${{ github.head_ref || github.ref_name }}
